# COSMABL fork CI (PRD D21): build the cal.diy web + v2 API images in CI and push
# to GHCR, so the Sydney VPS never runs the 4-6GB monorepo build — Coolify just
# pulls these prebuilt images. Triggered on push to the pinned COSMABL branch.
name: cosmabl-build-image

on:
  push:
    branches: [cosmabl-local, cosmabl-prod]
    tags: ["cosmabl-*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: cal.diy-web
            dockerfile: Dockerfile
          - image: cal.diy-api
            dockerfile: apps/api/v2/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      # Build args are only consumed by the web image; the api Dockerfile ignores
      # the extras. Real secrets are injected by Coolify at runtime, not baked in.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://cal.cosmabl.com
            NEXT_PUBLIC_API_V2_URL=https://cal.cosmabl.com/api/v2
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
